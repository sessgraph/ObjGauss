name: PR-02C CPU contract and tiny trainer

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr02c-cpu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-contract-tiny:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Use frozen Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install frozen uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.11.17
          python-version: 3.10.20
          enable-cache: false
          working-directory: learning
      - name: Install locked Node and learning dependencies
        run: |
          npm ci
          uv sync --project learning --frozen --no-dev
      - name: Run CPU contract, tiny trainer, and mutation tests offline
        env:
          UV_OFFLINE: "1"
          OBJGAUSS_LEARNING_OFFLINE: "1"
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          npm run check
          learning/.venv/bin/python -m unittest discover -s learning/tests -p 'test_*.py' -v
          learning/.venv/bin/objgauss-pr02c-hpo --mode contract --device cpu --output generated/pr02c/ci/hpo-contract.json
          learning/.venv/bin/objgauss-pr02c-trainer --mode tiny --device cpu --output generated/pr02c/ci/trainer-tiny.json
