[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "objgauss"
version = "0.1.0"
description = "Research-first Gaussian object assignment, ObjectState evaluation, and evidence tooling."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "LicenseRef-ObjGauss-Proprietary"
license-files = ["LICENSE"]
authors = [{ name = "ObjGauss contributors" }]
urls = { Repository = "https://github.com/sessgraph/ObjGauss" }
dependencies = [
  "numpy>=1.23,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0,<10",
]
sklearn = [
  "scikit-learn>=1.2,<2",
]

[project.scripts]
objgauss = "objgauss.cli:main"

[tool.setuptools.packages.find]
include = ["objgauss*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
