[build-system]
requires = ["uv_build==0.11.17"]
build-backend = "uv_build"

[project]
name = "objgauss-sim"
version = "0.1.0"
description = "Isolated offline sibling runtime and PR-02B/PR-02C source producer"
requires-python = "==3.10.20"
dependencies = []

[project.optional-dependencies]
runtime = [
  "mani-skill==3.0.1",
  "numpy==2.2.6",
  "sapien==3.0.3",
  "torch==2.13.0",
]

[project.scripts]
objgauss-pr01-runtime = "objgauss_sim.runtime:main"
objgauss-pr01-smoke = "objgauss_sim.smoke:main"
objgauss-pr01-golden = "objgauss_sim.adapter:main"
objgauss-pr01-cohort = "objgauss_sim.cohort:main"
objgauss-pr02-pilot = "objgauss_sim.pr02_pilot:main"
objgauss-pr02-data = "objgauss_sim.pr02_data:main"

[tool.uv]
default-groups = []
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
required-version = "==0.11.17"
