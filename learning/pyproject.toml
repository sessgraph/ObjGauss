[build-system]
requires = ["uv_build==0.11.17"]
build-backend = "uv_build"

[project]
name = "objgauss-learning"
version = "0.1.0"
description = "Isolated pure-PyTorch runtime for ObjGauss PR-02C"
requires-python = "==3.10.20"
dependencies = [
  "torch==2.13.0",
]

[project.scripts]
objgauss-pr02c-runtime = "objgauss_learning.runtime:main"
objgauss-pr02c-data = "objgauss_learning.data:main"
objgauss-pr02c-baselines = "objgauss_learning.baselines:main"
objgauss-pr02c-trainer = "objgauss_learning.trainer:main"
objgauss-pr02c-checkpoint-audit = "objgauss_learning.checkpoint:main"
objgauss-pr02c-hpo = "objgauss_learning.hpo:main"
objgauss-pr02c-selector = "objgauss_learning.selector:main"

[tool.uv]
default-groups = []
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
required-version = "==0.11.17"
